build-image:
  stage: build-image
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add make
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - make docker-push

    