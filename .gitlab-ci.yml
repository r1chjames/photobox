stages:
  - build-depdendencies
  - build-image


build-api:
  stage: build-depdendencies
  image:
    name: golang:alpine3.19
  before_script:
    - apk add make git
  script:
    - cd api && make build
  artifacts:
    paths:
      - api/bin/api


