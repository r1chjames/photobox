build-image:
  stage: build-image
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add make
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - make docker-push

    