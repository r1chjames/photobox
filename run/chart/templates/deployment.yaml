apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photobox.fullname" . }}
  labels:
    {{- include "photobox.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "photobox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "photobox.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "photobox.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.database.enabled }}
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "photobox.database.host" . }} {{ .Values.env.DB_PORT }}; do echo waiting for db; sleep 2; done']
        {{- end }}
        {{- if .Values.ollama.enabled }}
        - name: wait-for-ollama
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "photobox.fullname" . }}-ollama {{ .Values.ollama.service.port }}; do echo waiting for ollama; sleep 2; done']
        {{- end }}
      containers:
        - name: photobox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "photobox.fullname" . }}-config
            - secretRef:
                name: {{ include "photobox.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: "{{ .Values.env.API_BASE_PATH }}/health"
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: "{{ .Values.env.API_BASE_PATH }}/ready"
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: "{{ .Values.env.API_BASE_PATH }}/healthz"
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: photos
              mountPath: {{ .Values.env.PHOTO_DIR }}
      volumes:
        - name: photos
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: DirectoryOrCreate
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "photobox.fullname" . }}-photos
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
