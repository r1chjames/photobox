apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "photobox.fullname" . }}-api
  labels:
    {{- include "photobox.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "photobox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "photobox.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "photobox.serviceAccountName" . }}
      initContainers:
        {{- if .Values.database.enabled }}
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "photobox.database.host" . }} {{ .Values.api.env.DB_PORT }}; do echo waiting for db; sleep 2; done']
        {{- end }}
        {{- if .Values.ollama.enabled }}
        - name: wait-for-ollama
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "photobox.fullname" . }}-ollama {{ .Values.ollama.service.port }}; do echo waiting for ollama; sleep 2; done']
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "photobox.fullname" . }}-config
            - secretRef:
                name: {{ include "photobox.api.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: "{{ .Values.api.env.API_BASE_PATH }}/health"
              port: http
          readinessProbe:
            httpGet:
              path: "{{ .Values.api.env.API_BASE_PATH }}/health"
              port: http
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: photos
              mountPath: {{ .Values.api.env.PHOTO_DIR }}
      volumes:
        - name: photos
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: DirectoryOrCreate
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "photobox.fullname" . }}-photos
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
