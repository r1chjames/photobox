{{- if .Values.faceEngine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "photobox.fullname" . }}-face-engine
  labels:
    {{- include "photobox.labels" . | nindent 4 }}
    app.kubernetes.io/component: face-engine
spec:
  type: {{ .Values.faceEngine.service.type }}
  ports:
    - port: {{ .Values.faceEngine.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "photobox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: face-engine
{{- end }}
