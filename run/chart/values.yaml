# Default values for photobox.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# The combined image ships both the Go API and the React webapp (served by
# nginx on port 80, which proxies /api/ to the in-container API on 8080).
image:
  repository: ghcr.io/r1chjames/photobox
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# ---------------------------------------------------------
# Application environment (non-secret). Secrets live in .secrets below.
# ---------------------------------------------------------
env:
  DB_PORT: "5432"
  DB_USER: photobox
  DB_NAME: photobox
  PHOTO_DIR: /photos
  API_BASE_PATH: /api
  # Disabled by default. Enable together with ollama.enabled to turn on AI.
  AI_ENABLED: "false"
  OLLAMA_MODEL: moondream
  # If empty, defaults to the internal Ollama service when ollama.enabled is true.
  OLLAMA_HOST: ""
  DEFAULT_ADMIN_USERNAME: admin
  CORS_ALLOWED_ORIGINS: ""
  TOKEN_DURATION: 24h
  CACHE_ENABLED: "false"
  CACHE_HOST: ""

# If existingSecret is set, the generated secret is not created and all values
# below must be provided externally.
existingSecret: ""
secrets:
  # Must match database.postgresql.auth.password when database.enabled is true.
  dbPassword: photobox
  # TOKEN is the Paseto symmetric key and MUST be exactly 32 bytes. Override in
  # production; the default placeholder is only valid so `helm template` renders.
  token: "change-this-to-a-32-byte-secret!"
  # Must be >=8 chars and not a known-weak value. Override in production.
  adminPassword: "change-this-admin-password"
  # S3/MinIO — only required when env.THUMBNAIL_STORAGE is set to "s3".
  s3Endpoint: ""
  s3AccessKey: ""
  s3SecretKey: ""
  s3Bucket: "photobox-thumbnails"

# ---------------------------------------------------------
# Service (exposes the combined container on port 80)
# ---------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  loadBalancerIP: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Container-level security context. Full non-root / readOnlyRootFilesystem
# hardening requires a non-root image (see README); enable per-environment.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod-level security context. fsGroup lets the container write to the shared
# photos PVC without running as root.
podSecurityContext:
  fsGroup: 1000

# ---------------------------------------------------------
# Ingress
# ---------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations:
    # Traefik examples — uncomment/adjust per cluster:
    # traefik.ingress.kubernetes.io/router.tls: "true"
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
  # Websocket support (for /api/ws) requires the following annotations on
  # most controllers; Traefik enables websockets by default.
  hosts:
    - host: photobox.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------
# Shared Persistence (Photos)
# ---------------------------------------------------------
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # If set, uses a hostPath volume instead of a PVC.
  hostPath: ""

# ---------------------------------------------------------
# Ollama (AI runtime) — disabled by default
# ---------------------------------------------------------
ollama:
  enabled: false
  replicaCount: 1
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 11434
  resources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 2Gi
  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi

# ---------------------------------------------------------
# Database
# ---------------------------------------------------------
# When enabled, deploys a Bitnami PostgreSQL subchart.
# When disabled, set database.host and secrets.dbPassword
# (and matching env.DB_* values) to point to an external database.
database:
  enabled: true
  # If disabled, set this to your external DB host.
  host: ""
  postgresql:
    auth:
      database: photobox
      username: photobox
      password: photobox
      postgresPassword: photobox
    primary:
      persistence:
        enabled: true
        storageClass: ""
        size: 10Gi

# ---------------------------------------------------------
# HorizontalPodAutoscaler (optional)
# ---------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}
