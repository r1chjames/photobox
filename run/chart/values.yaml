# Default values for photobox.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------
# Ingress
# ---------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: photobox.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------
# Shared Persistence (Photos)
# ---------------------------------------------------------
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # If set, uses a hostPath volume instead of a PVC.
  hostPath: ""

# ---------------------------------------------------------
# API (Go backend)
# ---------------------------------------------------------
api:
  enabled: true
  replicaCount: 1
  image:
    # Update to your published API image
    repository: photobox-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    DB_PORT: "5432"
    DB_USER: photobox
    DB_NAME: photobox
    PHOTO_DIR: /photos
    API_BASE_PATH: /api
    AI_ENABLED: "true"
    OLLAMA_MODEL: moondream
    # If empty, defaults to the internal Ollama service when ollama.enabled is true
    OLLAMA_HOST: ""
    DEFAULT_ADMIN_USERNAME: admin
    CORS_ALLOWED_ORIGINS: ""
    TOKEN_DURATION: 24h
    CACHE_ENABLED: "false"
  # Secrets for the API. If existingSecret is set, a secret will not be created.
  existingSecret: ""
  secrets:
    # Must match database.postgresql.auth.password when database.enabled is true
    dbPassword: photobox
    token: change-me
    adminPassword: admin

# ---------------------------------------------------------
# Webapp (React frontend)
# ---------------------------------------------------------
webapp:
  enabled: true
  replicaCount: 1
  image:
    # Update to your published webapp image
    repository: photobox-webapp
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    loadBalancerIP: ""
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# ---------------------------------------------------------
# Ollama (AI runtime)
# ---------------------------------------------------------
ollama:
  enabled: true
  replicaCount: 1
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 11434
  resources: {}
  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi

# ---------------------------------------------------------
# Database
# ---------------------------------------------------------
# When enabled, deploys a Bitnami PostgreSQL subchart.
# When disabled, set database.host and api.secrets.dbPassword
# (and matching api.env.DB_* values) to point to an external database.
database:
  enabled: true
  # If disabled, set this to your external DB host.
  host: ""
  postgresql:
    auth:
      database: photobox
      username: photobox
      password: photobox
      postgresPassword: photobox
    primary:
      persistence:
        enabled: true
        storageClass: ""
        size: 10Gi
