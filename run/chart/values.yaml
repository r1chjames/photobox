# Default values for photobox.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/r1chjames/photobox
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: gitlab-login
nameOverride: ""
fullnameOverride: ""

service:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.210
  port: 8080

env:
  DB_HOST: mysql.infra
  DB_USER: photobox
  DB_PASSWORD: photobox
  DB_NAME: photobox
  PHOTO_DIR: /photos
  API_BASE_PATH: /api

hostMounts:
  - name: photos
    hostPath: /media/data/Users/Rich/Pictures/Photos
    mountPath: /photos

serviceAccount:
  create: true

persistence:
  enabled: false

ingress:
  enabled: false
  annotations:
  hosts:
    - host: ""
      paths:
        - 

resources:
  limits:
    cpu: "100m"
    memory: "128Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"