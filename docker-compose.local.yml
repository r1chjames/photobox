services:
  postgres:
    image: postgres:15-alpine
    container_name: photobox-postgres
    environment:
      POSTGRES_USER: photobox
      POSTGRES_PASSWORD: photobox
      POSTGRES_DB: photobox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobox"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - photobox

  ollama:
    image: ollama/ollama:latest
    container_name: photobox-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - photobox
    # For GPU support on Linux, uncomment the deploy block below.
    # Docker Desktop for Mac/Windows does not support GPU passthrough.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  face-engine:
    build:
      context: ./face-engine
      dockerfile: Dockerfile
    container_name: photobox-face-engine
    environment:
      FACE_MODELS_DIR: /models
      FACE_PORT: "5010"
    ports:
      - "5010:5010"
    networks:
      - photobox
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5010/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.local
    container_name: photobox-api
    depends_on:
      postgres:
        condition: service_healthy
      face-engine:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: photobox
      DB_PASSWORD: photobox
      DB_NAME: photobox
      PHOTO_DIR: /photos
      API_BASE_PATH: /api
      AI_ENABLED: true
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: moondream
      FACE_ENGINE_ENABLED: true
      FACE_ENGINE_URL: http://face-engine:5010
      DEFAULT_ADMIN_USERNAME: admin
      # Must satisfy the API's login validation (password min=8 chars) and not
      # be on the weak-password denylist (see api/internal/appconfig/validation.go).
      # Note: only applied when the admin user does NOT exist yet — an existing
      # local volume keeps its old admin password (reset with `docker compose down -v`).
      DEFAULT_ADMIN_PASSWORD: photobox-dev-admin
      CORS_ALLOWED_ORIGINS: http://localhost
      # Must be exactly 32 bytes for the Paseto token service (chacha20poly1305 key size).
      TOKEN: ${TOKEN:-photobox-local-secret-key-32byte}
      TOKEN_DURATION: 24h
      CACHE_ENABLED: false
      DB_SSL_MODE: disable
    volumes:
      - ./photos:/photos
    ports:
      - "8080:8080"
    networks:
      - photobox
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: photobox-webapp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - photobox

  # One-time helper to pull the AI model.
  # Run with: docker compose -f docker-compose.local.yml --profile init run --rm ollama-pull
  ollama-pull:
    image: curlimages/curl:latest
    container_name: photobox-ollama-pull
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        echo 'Pulling moondream model into Ollama...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"moondream\"}' &&
        echo 'Done.'
      "
    networks:
      - photobox
    profiles:
      - init

volumes:
  postgres_data:
  ollama_data:

networks:
  photobox:
    driver: bridge
